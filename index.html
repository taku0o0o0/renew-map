<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RENEW 2026 工房見学・ワークショップマップ</title>
<meta name="description" content="RENEW 2026（福井・鯖江・越前）の工房見学とワークショップを地図で探せる非公式マップ">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e20000; --ink:#1d1d1f; --sub:#6b6b70; --line:#e6e4df; --bg:#faf9f6; --card:#fff;
  --tour:#1f6fb2; --ws:#e07800; --both:#e20000; --fav:#f2b400;
  --sb:380px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit}
#app{display:flex;height:100dvh}
#side{width:var(--sb);flex:none;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);z-index:500;min-height:0}
#map{flex:1;min-width:0}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-size:20px;letter-spacing:.06em;color:var(--red);font-weight:700}
.brand span{font-size:13px;font-weight:700}
.dates{font-size:11.5px;color:var(--sub);margin-top:2px}
.filters{padding:10px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:#fff}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg)}
.search:focus{outline:2px solid var(--red);outline-offset:-1px;background:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .lbl{font-size:11px;color:var(--sub);width:34px;flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;line-height:1.3}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.t[aria-pressed=true]{background:var(--tour);border-color:var(--tour)}
.chip.w[aria-pressed=true]{background:var(--ws);border-color:var(--ws)}
.chip.f[aria-pressed=true]{background:var(--fav);border-color:var(--fav);color:#000}
.genres{display:none}
.genres.open{display:flex}
.more{font-size:12px;color:var(--sub);background:none;border:none;cursor:pointer;padding:2px 0;text-decoration:underline}
.count{padding:8px 16px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow:auto;padding:0 10px 90px;min-height:0}
.item{display:flex;gap:10px;padding:10px;border-radius:12px;background:var(--card);margin-bottom:8px;border:1px solid var(--line);cursor:pointer}
.item:hover{border-color:#bbb}
.item.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.item img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.item .nm{font-weight:700;font-size:14.5px;line-height:1.35}
.item .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;color:#fff;font-weight:500}
.tag.t{background:var(--tour)}.tag.w{background:var(--ws)}
.tag.r{background:#fff;color:var(--red);border:1px solid var(--red)}
.tag.n{background:#fff;color:#2c8a3f;border:1px solid #2c8a3f}
.wsn{font-size:12px;margin-top:4px;color:#444;line-height:1.45}
.star{margin-left:auto;align-self:flex-start;background:none;border:none;font-size:20px;cursor:pointer;color:#ccc;padding:0 2px;line-height:1}
.star.on{color:var(--fav)}
/* detail */
#detail{position:absolute;inset:0;background:var(--bg);z-index:5;display:none;flex-direction:column}
#detail.open{display:flex}
#side{position:relative}
.dhead{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.back{border:none;background:none;font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px}
.back:hover{background:var(--bg)}
.dbody{overflow:auto;flex:1;padding-bottom:90px}
.hero{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#eee}
.dpad{padding:14px 16px}
.dname{font-size:20px;font-weight:700;margin:0 0 4px;line-height:1.35}
.addr{font-size:12.5px;color:var(--sub);line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:#fff;cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.fav.on{background:var(--fav);border-color:var(--fav)}
.sec{margin:14px 16px 0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sec h3{margin:0;padding:10px 14px;font-size:14px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec.t h3{background:var(--tour)}.sec.w h3{background:var(--ws)}
.sec h3 small{font-weight:500;font-size:11px;opacity:.9;white-space:nowrap}
dl{margin:0;padding:8px 14px 12px;display:grid;grid-template-columns:72px 1fr;gap:6px 10px;font-size:13px;line-height:1.55}
dt{color:var(--sub);font-size:12px;padding-top:1px}
dd{margin:0;white-space:pre-wrap;word-break:break-word}
dd a{color:var(--tour);font-weight:500}
.resv{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.resv a{font-size:13px;padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:700;border:1px solid var(--ink)}
.resv a.web{background:var(--ink);color:#fff}
.daychips{display:flex;gap:4px;padding:10px 14px 0}
.day{font-size:11.5px;padding:2px 8px;border-radius:5px;background:#f0eee9;color:#aaa;text-decoration:line-through}
.day.on{background:#fff2e0;color:#8a4a00;text-decoration:none;font-weight:700}
.sec.t .day.on{background:#e6f0fa;color:#134a78}
.note{font-size:11px;color:var(--sub);padding:16px;line-height:1.6}
/* map pins */
/* ピン：エリア色の札（コード＋見/体/両） */
.pin{position:absolute;left:0;bottom:7px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:3px;padding:2px 6px 2px 2px;border-radius:999px;background:var(--ac);color:#fff;font-size:11.5px;font-weight:700;line-height:1;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap;font-feature-settings:"tnum"}
.pin::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid #fff}
.pin b{width:17px;height:17px;border-radius:50%;background:#fff;color:var(--ac);display:grid;place-items:center;font-size:10.5px}
.pin.sel{transform:translateX(-50%) scale(1.3);transform-origin:50% 100%;background:var(--ink);z-index:9}
.pin.sel b{color:var(--ink)}
.pin.fv::before{content:"★";position:absolute;top:-10px;right:-7px;color:var(--fav);font-size:14px;text-shadow:0 0 2px #000,0 0 1px #000}
.cl{border-radius:50%;background:var(--ac);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 30%,transparent),0 2px 6px rgba(0,0,0,.3)}
.bub{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid var(--ac);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:0 2px 8px rgba(0,0,0,.25);white-space:nowrap;cursor:pointer}
.bub i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.bub b{font-size:13.5px;color:var(--ac)}
.bub small{font-size:11.5px;color:var(--sub);font-weight:700}
.bub.zero{opacity:.45}
#map.ov .spot:not(.stay) .lb{display:none}
.alabel{background:none;border:none;box-shadow:none;padding:0;font-family:inherit}
.alabel::before{display:none}
.alabel span{display:inline-block;background:#fff;color:var(--ac);border:2px solid var(--ac);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.alabel span i{font-style:normal;background:var(--ac);color:#fff;border-radius:4px;padding:0 5px;margin-right:5px}
.spot{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.spot .ic{width:26px;height:26px;border-radius:7px;background:#222;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.spot .lb{margin-top:2px;font-size:11px;font-weight:700;color:#222;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.spot.stay .ic{width:34px;height:34px;border-radius:50%;background:#111;font-size:18px;border:3px solid var(--fav);box-shadow:0 0 0 5px rgba(242,180,0,.35),0 2px 6px rgba(0,0,0,.4)}
.spot.stay .lb{font-size:12.5px;background:var(--fav);color:#000;text-shadow:none;padding:2px 7px;border-radius:6px;margin-top:4px}
.acode{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--ac);border-radius:4px;padding:1px 5px;margin-right:5px;vertical-align:1px;font-feature-settings:"tnum"}
.ahead{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 4px 6px;font-size:13px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:6px}
.ahead::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--ac)}
.ahead small{color:var(--sub);font-weight:500}
.chip.a[aria-pressed=true]{background:var(--ac);border-color:var(--ac)}
.sortsel{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:#fff}
.stayline{font-size:12.5px;margin-top:6px}
.leaflet-tooltip.tip{font-family:inherit;font-size:12px;font-weight:700;padding:3px 7px}
.legend{background:#fff;padding:8px 10px;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.2);font-size:11.5px;line-height:1.8}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.locbtn{width:40px;height:40px;background:#fff;border:none;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer;font-size:18px;display:grid;place-items:center}
.me{width:16px;height:16px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
#toggle{display:none}
/* mobile */
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;height:52dvh;order:2;border-right:none;border-top:1px solid var(--line);transition:height .25s}
  #map{order:1;flex:1}
  #app.mapfull #side{height:0;overflow:hidden}
  header{padding:10px 16px 8px}
  .brand b{font-size:17px}
  .filters{padding:8px 16px}
  #toggle{display:block;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:1000;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:11px 20px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .legend{display:none}
  /* スマホ：絞り込みごと一緒にスクロールして、リストを広く見せる */
  #side{overflow-y:auto;-webkit-overflow-scrolling:touch}
  #list{flex:none;overflow:visible}
  #detail{position:fixed;left:0;right:0;bottom:0;top:auto;height:52dvh;z-index:900;border-top:1px solid var(--line)}
  #app.mapfull #detail{display:none}
  .hero{aspect-ratio:auto;height:150px}
}
/* タブ */
.tabs{display:flex;gap:4px;padding:8px 16px 0;background:#fff;border-bottom:1px solid var(--line)}
.tab{flex:1;border:none;background:none;padding:9px 4px 10px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
#findView{display:flex;flex-direction:column;flex:1;min-height:0}
#planView{flex:1;overflow:auto;min-height:0;padding:0 12px 100px}
[hidden]{display:none!important}
/* 予定・予約済み */
.tag.ok{background:#1e8e4e}
.pin.rs{box-shadow:0 0 0 3px #1e8e4e,0 1px 4px rgba(0,0,0,.4)}
.pin .ck{position:absolute;top:-8px;left:-6px;width:15px;height:15px;border-radius:50%;background:#1e8e4e;color:#fff;font-size:10px;display:grid;place-items:center;border:1.5px solid #fff}
.plans{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:8px;background:#f3f8f4;border:1px solid #cfe6d6;border-radius:9px;padding:7px 10px;font-size:13px}
.pl.notres{background:#f6f5f2;border-color:var(--line)}
.pl b{white-space:nowrap}
.pl .sp{flex:1;min-width:0;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl button,.mini{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;padding:4px 8px;cursor:pointer}
.addbtn{margin:0 14px 14px;width:calc(100% - 28px);padding:10px;border-radius:10px;border:1.5px dashed #1e8e4e;background:#fff;color:#1e8e4e;font-weight:700;font-size:13.5px;cursor:pointer}
.badge-ok{display:inline-block;background:#1e8e4e;color:#fff;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700}
.badge-pl{display:inline-block;background:#fff;color:#1e8e4e;border:1px solid #1e8e4e;border-radius:5px;padding:0 6px;font-size:11px;font-weight:700}
/* スケジュール画面 */
.pdays{display:flex;gap:6px;padding:12px 0 8px;position:sticky;top:0;background:var(--bg);z-index:3}
.pday{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 4px;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.pday small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
.pday[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pday[aria-pressed=true] small{color:#ddd}
.psum{font-size:12px;color:var(--sub);margin:2px 2px 10px}
.stop{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.stop .no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac,#333);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.stop .tm{font-size:13px;font-weight:700;font-feature-settings:"tnum"}
.stop .nm2{font-size:14.5px;font-weight:700;line-height:1.35;margin-top:1px}
.stop .sub{font-size:12px;color:var(--sub);margin-top:2px}
.stop .memo{font-size:12.5px;margin-top:4px;background:#fffbe6;border-radius:6px;padding:3px 7px;white-space:pre-wrap}
.stop .warn{font-size:12px;color:#c62828;font-weight:700;margin-top:4px}
.stop .acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.home{background:#111;color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.home small{font-weight:500;color:#ccc}
.leg{font-size:12px;color:var(--sub);padding:6px 0 6px 22px;margin-left:12px;border-left:2px dotted #bbb;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg a{color:var(--tour);font-weight:700}
.pfoot{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pfoot .btn{justify-content:center}
.pempty{background:#fff;border:1px dashed #bbb;border-radius:12px;padding:16px;font-size:13px;color:var(--sub);line-height:1.7;margin-top:6px}
.favs{margin-top:18px}
.favs h4{font-size:13px;margin:0 0 6px}
.favrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;cursor:pointer}
.favrow .nm{flex:1;font-weight:700}
.rnum{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
/* 予定フォーム */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:3000;display:none;align-items:center;justify-content:center;padding:16px}
#sheet.open{display:flex}
.sheet{background:#fff;border-radius:16px;width:min(420px,100%);max-height:90dvh;overflow:auto;padding:16px 16px 14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.sheet h3{margin:0 0 2px;font-size:16px}
.sheet .who{font-size:12.5px;color:var(--sub);margin-bottom:12px}
.sheet label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:700}
.sheet .seg{display:flex;gap:6px}
.sheet .seg button{flex:1;padding:8px 2px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.sheet .seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sheet .seg button:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sheet input[type=time],.sheet input[type=number],.sheet textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.sheet .two{display:flex;gap:10px}.sheet .two>div{flex:1}
.sheet .hint{font-size:11.5px;color:var(--sub);margin-top:4px;line-height:1.5;white-space:pre-wrap}
.sheet .rs{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 12px;border:1.5px solid #1e8e4e;border-radius:10px;background:#f3f8f4;font-weight:700;font-size:14px;cursor:pointer}
.sheet .rs input{width:20px;height:20px;accent-color:#1e8e4e}
.sheet .sbtns{display:flex;gap:8px;margin-top:16px}
.sheet .sbtns button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff}
.sheet .sbtns .save{background:#1e8e4e;color:#fff;border-color:#1e8e4e}
.sheet .sbtns .del{flex:none;color:#c62828}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <div class="brand"><b>RENEW 2026</b><span>工房見学・ワークショップMAP</span></div>
      <div class="dates">10/9（金）・10（土）・11（日）｜福井県 鯖江市・越前市・越前町</div>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="find" aria-selected="true">さがす</button>
      <button class="tab" role="tab" data-tab="plan" aria-selected="false">スケジュール<span class="n" id="plancount" hidden></span></button>
    </div>
    <div id="findView">
    <div class="filters">
      <input id="q" class="search" type="search" placeholder="名前・体験内容で検索（例：漆、めがね、紙漉き）">
      <div class="row"><span class="lbl">種類</span>
        <button class="chip t" data-k="tour" aria-pressed="true">工房見学</button>
        <button class="chip w" data-k="ws" aria-pressed="true">ワークショップ</button>
        <button class="chip f" data-k="fav" aria-pressed="false">★ 行きたい</button>
        <button class="chip" data-k="planned" aria-pressed="false" style="--x:1">✓ 予定・予約済み</button>
      </div>
      <div class="row"><span class="lbl">日にち</span>
        <button class="chip" data-day="0" aria-pressed="true">全日</button>
        <button class="chip" data-day="9" aria-pressed="false">9（金）</button>
        <button class="chip" data-day="10" aria-pressed="false">10（土）</button>
        <button class="chip" data-day="11" aria-pressed="false">11（日）</button>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const GENRES = ['眼鏡','越前漆器','越前和紙','越前焼','越前打刃物','越前箪笥','繊維','その他のものづくり','地域企業'];
const DOW = {9:'金',10:'土',11:'日'};
const FAVKEY = 'renew2026-fav-v1';
let fav = new Set();
try { fav = new Set(JSON.parse(localStorage.getItem(FAVKEY) || '[]')); } catch(e) {}
const saveFav = () => { try { localStorage.setItem(FAVKEY, JSON.stringify([...fav])); } catch(e) {} };

// 予定（予約済みも含む）。{id,u,ref:'tour'|ワークショップURL,day,start:'HH:MM',dur:分,res:予約済みか,memo}
const PLANKEY = 'renew2026-plan-v1';
let plans = [];
try { plans = JSON.parse(localStorage.getItem(PLANKEY) || '[]'); } catch(e) {}
const savePlans = () => { try { localStorage.setItem(PLANKEY, JSON.stringify(plans)); } catch(e) {} };
// スケジュールの初期表示日：会期中なら今日、それ以外は初日
const TODAY = (() => { const n = new Date(); return n.getFullYear() === 2026 && n.getMonth() === 9 && n.getDate() >= 9 && n.getDate() <= 11 ? n.getDate() : 9; })();
const S = { planned:false, tab:'find', pday:TODAY, tour:true, ws:true, fav:false, day:0, rv:'all', q:'', genres:new Set(), areas:new Set(), sel:null, me:null, sort:'area' };
// 公式ガイドマップ（PDF）のエリア区分 MAP A〜F
const AREAS = {
  A: { n: '河和田', c: '#cf3f35' }, B: { n: '鯖江', c: '#2d7cc0' }, C: { n: '神明', c: '#7350c4' },
  D: { n: '越前町', c: '#b5701c' }, E: { n: '武生', c: '#24865a' }, F: { n: '今立', c: '#c04788' },
};
const areaOf = e => e.c[0];
const STAY = { n: 'さばえめがねハウス', addr: '福井県鯖江市別司町31-17', lat: 35.95005, lng: 136.258026, url: 'https://sabae-megane-house.com/' };
const INFO = [
  { n: '河和田案内所（うるしの里会館）', addr: '鯖江市西袋町40-1-2', lat: 35.952621, lng: 136.273956 },
  { n: '今立案内所（岡本郵便局2軒隣）', addr: '越前市岩本町10-12-2', lat: 35.90929, lng: 136.245163 },
  { n: '越前町案内所（越前陶芸村）', addr: '丹生郡越前町小曽原6-12', lat: 35.935459, lng: 136.060379 },
];
const fmtKm = d => d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rvClass = t => !t ? 'pref' : /要予約/.test(t) ? 'req' : /不要/.test(t) ? 'none' : 'pref';
const rvLabel = c => ({req:'要予約', none:'予約不要', pref:'予約優先・飛入可'}[c]);

// URLs / mail / tel を押せるリンクにする
function linkify(text) {
  let s = esc(text);
  s = s.replace(/(https?:\/\/[^\s<>"'）)]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 42 ? u.slice(0, 40) + '…' : u}</a>`);
  s = s.replace(/([\w.+-]+@[\w-]+(?:\.[\w-]+)+)/g, m => `<a href="mailto:${m}">${m}</a>`);
  s = s.replace(/(?<![\d\w/])(0\d{1,4}-\d{1,4}-\d{3,4})(?![\d])/g, m => `<a href="tel:${m.replace(/-/g, '')}">${m}</a>`);
  return s;
}
// 予約方法テキストから大きいボタンを作る
function resvButtons(text) {
  if (!text) return '';
  const out = [], seen = new Set();
  for (const u of text.match(/https?:\/\/[^\s<>"'）)]+/g) || []) {
    if (seen.has(u)) continue; seen.add(u);
    const lbl = /instagram/.test(u) ? 'Instagramで予約' : /line\.me|lin\.ee/.test(u) ? 'LINEで予約' : /forms|reserva|coubic|airrsv|peatix|stores|select-type|form/.test(u) ? '予約フォーム' : '予約ページ';
    out.push(`<a class="web" href="${esc(u)}" target="_blank" rel="noopener">${lbl} ↗</a>`);
  }
  for (const m of text.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g) || []) if (!seen.has(m)) { seen.add(m); out.push(`<a href="mailto:${esc(m)}">✉ メール</a>`); }
  for (const m of text.match(/0\d{1,4}-\d{1,4}-\d{3,4}/g) || []) if (!seen.has(m)) { seen.add(m); out.push(`<a href="tel:${m.replace(/-/g, '')}">☎ ${m}</a>`); }
  return out.length ? `<div class="resv">${out.join('')}</div>` : '';
}

// 各出展者の中で、今のフィルタに合う見学/WSを返す
function matchItems(e) {
  const dayOK = days => !S.day || !days || !days.length || days.includes(S.day);
  const rvOK = t => { const c = rvClass(t); return S.rv === 'all' || (S.rv === 'req' ? c === 'req' : c !== 'req'); };
  const tour = S.tour && e.tour && dayOK(e.tour._d) && rvOK(e.tour['予約']) ? e.tour : null;
  const ws = S.ws ? e.ws.filter(w => dayOK(w.d) && rvOK(w.i['予約'])) : [];
  return { tour, ws };
}
function visible(e) {
  if (S.fav && !fav.has(e.u)) return null;
  if (S.planned && !plans.some(p => p.u === e.u)) return null;
  if (S.genres.size && !e.g.some(g => S.genres.has(g))) return null;
  if (S.areas.size && !S.areas.has(areaOf(e))) return null;
  if (S.q) {
    const hay = [e.n, e.addr, e.c, AREAS[areaOf(e)].n, ...e.g, ...e.ws.map(w => w.t)].join(' ').toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(k => hay.includes(k))) return null;
  }
  const m = matchItems(e);
  return (m.tour || m.ws.length) ? m : null;
}
const kindOf = e => e.tour && e.ws.length ? 'b' : e.tour ? 't' : 'w';

function dist(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

// ---- map ----
const map = L.map('map', { zoomControl: false, maxZoom: 19, minZoom: 9 }).setView([35.93, 136.18], 12);
L.control.zoom({ position: 'topright' }).addTo(map);
// 背景：一般的な地図アプリ風（OpenFreeMap のベクタ地図、日本語ラベル）。使えない環境では OSM 標準地図
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
function osmFallback() {
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: OSM_ATTR }).addTo(map);
}
(async () => {
  try {
    if (!L.maplibreGL || !window.maplibregl) throw 0;
    const style = await (await fetch('https://tiles.openfreemap.org/styles/liberty')).json();
    for (const l of style.layers) {
      if (l.layout && l.layout['text-field']) l.layout['text-field'] = ['coalesce', ['get', 'name:ja'], ['get', 'name']];
    }
    L.maplibreGL({ style, attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> ' + OSM_ATTR }).addTo(map);
  } catch (e) { osmFallback(); }
})();
// エリアごとに別のクラスタにして、違うエリア同士がまとまらないようにする
const OVERVIEW_Z = 12;
const clusters = {};
for (const [k, a] of Object.entries(AREAS)) {
  clusters[k] = L.markerClusterGroup({ showCoverageOnHover: false, spiderfyOnMaxZoom: true,
    maxClusterRadius: z => z >= 17 ? 18 : z >= 15 ? 28 : 40,
    iconCreateFunction: c => { const n = c.getChildCount(), s = n < 10 ? 30 : 36;
      return L.divIcon({ className: '', iconSize: [s, s], html: `<div class="cl" style="--ac:${a.c};width:${s}px;height:${s}px">${n}</div>` }); } });
}
const clusterOf = u => clusters[areaOf(D.find(x => x.u === u))];

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = Object.entries(AREAS).map(([k, a]) => `<div><span style="background:${a.c}"></span>${k} ${a.n}エリア</div>`).join('')
    + '<hr><div>見＝工房見学　体＝ワークショップ　両＝両方</div><div>i＝案内所　🏠＝宿（めがねハウス）</div>'; return d; };
legend.addTo(map);

const loc = L.control({ position: 'topright' });
loc.onAdd = () => { const b = L.DomUtil.create('button', 'locbtn'); b.title = '現在地'; b.innerHTML = '◎';
  L.DomEvent.on(b, 'click', e => { L.DomEvent.stop(e); locate(); }); return b; };
loc.addTo(map);
let meMarker = null;
function locate() {
  if (!navigator.geolocation) return alert('この端末では現在地を取得できません');
  navigator.geolocation.getCurrentPosition(p => {
    S.me = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (meMarker) meMarker.setLatLng(S.me);
    else meMarker = L.marker(S.me, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }), zIndexOffset: 1000 }).addTo(map);
    map.setView(S.me, 14);
    S.sort = 'me'; document.getElementById('sort').value = 'me';
    render();
  }, () => alert('現在地を取得できませんでした'), { enableHighAccuracy: true, timeout: 10000 });
}

const markers = new Map();
function pinIcon(e) {
  const k = kindOf(e), lbl = { t: '見', w: '体', b: '両' }[k];
  return L.divIcon({ className: '', iconSize: [0, 0],
    html: `<div class="pin${S.sel === e.u ? ' sel' : ''}${fav.has(e.u) ? ' fv' : ''}${plans.some(p => p.u === e.u) ? ' rs' : ''}" style="--ac:${AREAS[areaOf(e)].c}">${plans.some(p => p.u === e.u) ? '<span class="ck">✓</span>' : ''}<b>${lbl}</b>${esc(e.c)}</div>` });
}
D.forEach(e => {
  const m = L.marker([e.lat, e.lng], { icon: pinIcon(e), area: areaOf(e), riseOnHover: true });
  m.bindTooltip(e.n, { className: 'tip', direction: 'top', offset: [0, -30] });
  m.on('click', () => openDetail(e.u, false));
  markers.set(e.u, m);
});

// ---- エリアの範囲（各エリアの工房を囲う柔らかい多角形）----
function hull(pts) {
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
const areaLayer = L.layerGroup().addTo(map), areaBounds = {}, bubbles = {}, bubbleLayer = L.layerGroup();
for (const [k, a] of Object.entries(AREAS)) {
  const pts = [];
  D.filter(e => areaOf(e) === k).forEach(e => {
    for (let i = 0; i < 16; i++) { const t = i / 16 * 2 * Math.PI; pts.push([e.lat + 0.0035 * Math.sin(t), e.lng + 0.0043 * Math.cos(t)]); }
  });
  const poly = L.polygon(hull(pts), { color: a.c, weight: 1.5, dashArray: '5 5', fillColor: a.c, fillOpacity: 0.07, interactive: false }).addTo(areaLayer);
  areaBounds[k] = poly.getBounds();
  // 河和田は宿のマークと重なるので、範囲の上側に出す
  const c = k === 'A' ? L.latLng(areaBounds[k].getNorth() + 0.004, areaBounds[k].getCenter().lng) : areaBounds[k].getCenter();

// ===== 予定・予約済み =====
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const toHM = n => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
const cmpPlan = (a, b) => a.day - b.day || toMin(a.start) - toMin(b.start);
const byU = u => D.find(x => x.u === u);
// 予定の対象（工房見学 or ワークショップ）の情報
function target(p) {
  const e = byU(p.u); if (!e) return null;
  if (p.ref === 'tour') return { e, kind: 'tour', title: '工房見学', info: e.tour || {}, days: e.tour?._d || [] };
  const w = e.ws.find(w => (w.u || w.t) === p.ref);
  return w ? { e, kind: 'ws', title: w.t, info: w.i, days: w.d } : { e, kind: 'ws', title: 'ワークショップ', info: {}, days: [] };
}
// 「15分」「60-90分」「約1時間」→ 分
function parseDur(s) {
  if (!s) return 30;
  const h = s.match(/(\d+(?:\.\d+)?)\s*時間/), m = s.match(/(\d+)\s*(?:-|〜|~)?\s*\d*\s*分/);
  return Math.round((h ? +h[1] * 60 : 0) + (m ? +m[1] : 0)) || 30;
}
// 開催日時の文字列から、その日の最初の開始時刻を拾う
function firstTime(s, day) {
  if (!s) return null;
  for (const line of s.split('\n')) {
    const i = line.indexOf('日'), tm = line.match(/(\d{1,2}):(\d{2})/);
    if (!tm) continue;
    let ok = true;
    if (i > 0 && i < tm.index) {
      const ds = new Set(), part = line.slice(0, i);
      for (const m of part.matchAll(/(\d{1,2})\s*[-‐〜~]\s*(\d{1,2})/g)) for (let d = +m[1]; d <= +m[2]; d++) ds.add(d);
      for (const m of part.matchAll(/\d{1,2}/g)) ds.add(+m[0]);
      ok = ds.has(day);
    }
    if (ok) return tm[1].padStart(2, '0') + ':' + tm[2];
  }
  return null;
}
function planBlock(u, ref) {
  const ps = plans.filter(p => p.u === u && p.ref === ref).sort(cmpPlan);
  if (!ps.length) return '';
  return '<div class="plans" style="padding-top:10px">' + ps.map(p => `<div class="pl${p.res ? '' : ' notres'}">
    ${p.res ? '<span class="badge-ok">✓ 予約済み</span>' : '<span class="badge-pl">予定</span>'}
    <b>${p.day}(${DOW[p.day]}) ${p.start}〜${toHM(toMin(p.start) + p.dur)}</b><span class="sp">${esc(p.memo || '')}</span>
    <button data-edit="${p.id}">編集</button></div>`).join('') + '</div>';
}
const addBtn = (u, ref) => `<button class="addbtn" data-add="${esc(u)}" data-ref="${esc(ref)}">＋ 予定に追加（予約済みもここから）</button>`;

function newPlan(u, ref) {

  const same = plans.filter(p => p.day === day).sort(cmpPlan), last = same[same.length - 1];
  let start = firstTime(when, day) || '10:00';

// ----- スケジュール画面 -----
const $plan = document.getElementById('planView');
const routeLayer = L.layerGroup().addTo(map);
const carMin = km => Math.max(3, Math.round(km * 1.3 / 30 * 60)); // 道のり≒直線×1.3、平均30km/hの目安
function dayStops(d) { return plans.filter(p => p.day === d).sort(cmpPlan).map(p => ({ p, tg: target(p) })).filter(x => x.tg); }
function gmapsDir(points) {
  const o = points[0], de = points[points.length - 1], w = points.slice(1, -1);

  const unplanned = D.filter(e => fav.has(e.u) && !plans.some(p => p.u === e.u));
  if (unplanned.length) h += `<div class="favs"><h4>★ 行きたい（まだ予定に入っていない）</h4>` + unplanned.map(e =>
    `<div class="favrow" data-open="${esc(e.u)}"><span class="acode" style="--ac:${AREAS[areaOf(e)].c}">${esc(e.c)}</span><span class="nm">${esc(e.n)}</span><span style="color:var(--sub);font-size:12px">宿から${fmtKm(dist(STAY, e))}</span></div>`).join('') + '</div>';
  h += `<p class="note">予定・予約済みの情報はこの端末のブラウザにだけ保存されます（他の人には見えません）。移動時間は直線距離からの目安です。</p>`;
  $plan.innerHTML = h;
  const cp = document.getElementById('copyDay');
  if (cp) cp.onclick = () => {
    const txt = [`RENEW 2026 ${S.pday}日（${DOW[S.pday]}）の予定`, ...stops.map(({ p, tg }) => `${p.start}-${toHM(toMin(p.start) + p.dur)} ${tg.e.c} ${tg.e.n}（${tg.kind === 'tour' ? '工房見学' : tg.title}）${p.res ? ' ✓予約済' : ''}${p.memo ? ' / ' + p.memo : ''}`), location.href].join('\n');
    navigator.clipboard?.writeText(txt).then(() => { cp.textContent = 'コピーしました'; setTimeout(() => cp.textContent = 'この日の予定をテキストでコピー', 1500); }, () => prompt('コピーしてください', txt));
  };
  drawRoute();
}
function drawRoute() {
  routeLayer.clearLayers();
  if (S.tab !== 'plan') return;
  const stops = dayStops(S.pday); if (!stops.length) return;
  const pts = [STAY, ...stops.map(s => s.tg.e), STAY].map(x => [x.lat, x.lng]);
  L.polyline(pts, { color: '#111', weight: 3, opacity: .7, dashArray: '2 7', lineCap: 'round' }).addTo(routeLayer);
  stops.forEach((s, i) => L.marker([s.tg.e.lat, s.tg.e.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="rnum" style="margin-top:-34px">${i + 1}</div>` }), zIndexOffset: 3000, interactive: false }).addTo(routeLayer));
}
function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  document.getElementById('findView').hidden = tab !== 'find';
  $plan.hidden = tab !== 'plan';
  if ($detail.classList.contains('open')) closeDetail();
  renderPlan();
  if (tab === 'plan') {
    const stops = dayStops(S.pday);
    if (stops.length) map.fitBounds(L.latLngBounds([STAY, ...stops.map(s => s.tg.e)].map(x => [x.lat, x.lng])), { padding: [40, 40], maxZoom: 15 });
  }
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));

// events
document.addEventListener('click', ev => {
  const ad = ev.target.closest('[data-add]');
  if (ad) { ev.stopPropagation(); openSheet(newPlan(ad.dataset.add, ad.dataset.ref)); return; }
  const ed = ev.target.closest('[data-edit]');
  if (ed) { ev.stopPropagation(); const p = plans.find(x => x.id === ed.dataset.edit); if (p) openSheet({ ...p }); return; }
  const pd = ev.target.closest('[data-pday]');
  if (pd) { S.pday = +pd.dataset.pday; setTab('plan'); return; }
  const op = ev.target.closest('[data-open]');
  if (op && !ev.target.closest('a')) { openDetail(op.dataset.open); return; }
  const f = ev.target.closest('[data-fav]');
  if (f) {
    ev.stopPropagation();
    const u = f.dataset.fav; fav.has(u) ? fav.delete(u) : fav.add(u); saveFav();
    markers.get(u).setIcon(pinIcon(D.find(y => y.u === u)));
    document.querySelectorAll(`[data-fav="${CSS.escape(u)}"]`).forEach(b => b.classList.toggle('on', fav.has(u)));
    if (S.fav) render();
    if (S.tab === 'plan') renderPlan();
    return;
  }
  const it = ev.target.closest('.item');
  if (it) openDetail(it.dataset.u);
});
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
  const k = b.dataset.k; S[k] = !S[k]; b.setAttribute('aria-pressed', S[k]); render();
});
document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
  S.day = +b.dataset.day; document.querySelectorAll('[data-day]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
document.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => {
  S.rv = b.dataset.rv; document.querySelectorAll('[data-rv]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
const $g = document.getElementById('genres');
$g.innerHTML = GENRES.filter(g => D.some(e => e.g.includes(g))).map(g => `<button class="chip" data-g="${g}" aria-pressed="false">${g}</button>`).join('');
$g.onclick = ev => { const b = ev.target.closest('[data-g]'); if (!b) return;
  const g = b.dataset.g; S.genres.has(g) ? S.genres.delete(g) : S.genres.add(g); b.setAttribute('aria-pressed', S.genres.has(g)); render(); };
document.getElementById('gtoggle').onclick = ev => { const o = $g.classList.toggle('open'); ev.target.textContent = o ? 'ジャンルを閉じる ▴' : 'ジャンルで絞り込む ▾'; };
let qt; document.getElementById('q').oninput = ev => { clearTimeout(qt); qt = setTimeout(() => { S.q = ev.target.value.trim(); render(); }, 150); };
const $t = document.getElementById('toggle');
function updToggle() { $t.textContent = document.getElementById('app').classList.contains('mapfull') ? 'リストを表示' : '地図を広く'; }
$t.onclick = () => { document.getElementById('app').classList.toggle('mapfull'); updToggle(); setTimeout(() => map.invalidateSize(), 260); };

const $a = document.getElementById('areas');
$a.insertAdjacentHTML('beforeend', Object.entries(AREAS).map(([k, a]) => `<button class="chip a" style="--ac:${a.c}" data-area="${k}" aria-pressed="false">${k} ${a.n}</button>`).join(''));
$a.onclick = ev => { const b = ev.target.closest('[data-area]'); if (!b) return;
  const k = b.dataset.area; S.areas.has(k) ? S.areas.delete(k) : S.areas.add(k); b.setAttribute('aria-pressed', S.areas.has(k)); render();
  const bs = [...S.areas].map(x => areaBounds[x]);
  if (bs.length) map.fitBounds(bs.reduce((acc, x) => acc.extend(x), L.latLngBounds(bs[0].getSouthWest(), bs[0].getNorthEast())), { padding: [20, 20] });
};
document.getElementById('sort').onchange = ev => {
  S.sort = ev.target.value;
  if (S.sort === 'me' && !S.me) return locate();
  if (S.sort === 'stay') map.setView([STAY.lat, STAY.lng], Math.max(map.getZoom(), 13));
  render();
};
render();
renderPlan(); updPlanCount();
applyZoomMode();
const ALL = L.latLngBounds(D.map(e => [e.lat, e.lng]));
function fitAll() { map.invalidateSize(); map.fitBounds(ALL, { padding: [30, 30] }); }
fitAll();
// 非表示タブ等でサイズ0のまま初期化された場合に備える
if (map.getZoom() > 14) setTimeout(fitAll, 300);
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
window.renewMap = { map, D, S };
</script>
</body>
</html>
